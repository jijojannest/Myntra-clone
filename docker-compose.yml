version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: myntra-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: myntra_clone
    volumes:
      - mongodb_data:/data/db
      - ./server/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - myntra-network

  redis:
    image: redis:alpine
    container_name: myntra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - myntra-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: myntra-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    networks:
      - myntra-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: myntra-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/myntra_clone?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      CLOUDINARY_CLOUD_NAME: your-cloud-name
      CLOUDINARY_API_KEY: your-api-key
      CLOUDINARY_API_SECRET: your-api-secret
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - myntra-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: myntra-client
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://server:5000/api
      REACT_APP_AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - server
      - ai-service
    networks:
      - myntra-network

  volumes:
  mongodb_data:

networks:
  myntra-network:
    driver: bridge